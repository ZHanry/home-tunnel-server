name: Server candidate images
# Called only from the registered CI workflow. This file has no dispatch entry of its own.
'on':
  workflow_call:
    inputs:
      build_candidate:
        description: Must be true. A manual branch run is the only caller that should set it.
        required: true
        type: boolean
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write
jobs:
  preflight:
    name: Check branch candidate gates
    if: ${{ inputs.build_candidate && github.event_name == 'workflow_dispatch' && github.event.inputs.build_candidate == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 scripts/release.py candidate-preflight
  images:
    name: Image (${{ matrix.name }})
    needs: preflight
    if: ${{ inputs.build_candidate && github.event_name == 'workflow_dispatch' && github.event.inputs.build_candidate == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: control-center
          context: ./control-center
          image: ghcr.io/zhanry/home-tunnel-control-center
        - name: traffic-gateway
          context: ./traffic-gateway
          image: ghcr.io/zhanry/home-tunnel-traffic-gateway
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: ${{ matrix.context }}
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ matrix.image }}:sha-${{ github.sha }}-${{ github.run_id }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}
    - name: Publish GitHub image attestation
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-name: ${{ matrix.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Keyless-sign immutable image digest
      env:
        IMAGE: ${{ matrix.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign sign --yes "$IMAGE@$DIGEST"
    - name: Write machine-readable digest record
      shell: bash
      env:
        NAME: ${{ matrix.name }}
        IMAGE: ${{ matrix.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        VERSION: ${{ needs.preflight.outputs.version }}
      run: |
        jq -n --arg name "$NAME" --arg image "$IMAGE" --arg digest "$DIGEST" \
          --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
          '{name:$name,image:$image,digest:$digest,version:$version,revision:$revision}' > "image-$NAME.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: image-${{ matrix.name }}
        path: image-${{ matrix.name }}.json
        if-no-files-found: error
  assemble:
    name: Assemble candidate inputs
    needs:
    - preflight
    - images
    if: ${{ inputs.build_candidate && github.event_name == 'workflow_dispatch' && github.event.inputs.build_candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: image-*
        path: release
        merge-multiple: true
    - run: |
        cp contracts/home-tunnel.v1.json contracts/openapi.v1.json contracts/api.schema.json release/
        cp contracts/home-tunnel.v2.json contracts/openapi.v2.json contracts/api.v2.schema.json contracts/nestlink-auth.v2-vectors.json release/
        cp contracts/nestlink-device-capabilities.v1.json contracts/nestlink-device-capabilities.v1.schema.json contracts/device-capabilities.lock.json release/
        cp contracts/remote-desktop.v1.json contracts/remote-authorization-vectors.json contracts/REMOTE_PROTOCOL.md release/
        cp deploy/frps/dependency.json release/frps-dependency.json
        cp deploy/frps/dependency.sigstore.json release/frps-dependency.json.sigstore.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-parts
        path: release/*
        if-no-files-found: error
  integration:
    name: Server integration (${{ matrix.arch }})
    needs:
    - preflight
    - assemble
    if: ${{ inputs.build_candidate && github.event_name == 'workflow_dispatch' && github.event.inputs.build_candidate == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: candidate-parts
        path: release
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.0
    - name: Run production-path integration with pinned client
      env:
        RC_VERSION: ${{ needs.preflight.outputs.version }}
        SMOKE_ARCH: ${{ matrix.arch }}
        HOME_TUNNEL_SMOKE_CLIENT_CREATION: "1"
      run: |
        set -euo pipefail
        python3 scripts/fetch-client-baseline.py "$SMOKE_ARCH" release
        export CLIENT_VERSION="$(jq -r .version tests/client-baseline.json)"
        export CONTROL_IMAGE="$(jq -r '.image + "@" + .digest' release/image-control-center.json)"
        export FRPS_IMAGE="$(jq -r '.image + "@" + .digest' release/frps-dependency.json)"
        export GATEWAY_IMAGE="$(jq -r '.image + "@" + .digest' release/image-traffic-gateway.json)"
        bash ./tests/run-release-smoke.sh
        mkdir -p integration
        cp release-smoke-evidence/release-smoke.json "integration/server-smoke-$SMOKE_ARCH.json"
        cp release-smoke-evidence/e2e-smoke.json "integration/server-port-settings-$SMOKE_ARCH.json"
    - name: Verify real STUN-only runtime in an isolated namespace
      env:
        SMOKE_ARCH: ${{ matrix.arch }}
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables
        python3 tests/stun-runtime.py --output "integration/stun-runtime-$SMOKE_ARCH.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: server-smoke-${{ matrix.arch }}
        path: integration/*
        if-no-files-found: error
  sign:
    name: Seal candidate bytes once
    needs:
    - preflight
    - integration
    if: ${{ inputs.build_candidate && github.event_name == 'workflow_dispatch' && github.event.inputs.build_candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: candidate-parts
        path: release
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: server-smoke-*
        path: release
        merge-multiple: true
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Seal the candidate checksum without publishing a release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOME_TUNNEL_CANDIDATE: "1"
      run: |
        set -euo pipefail
        python3 scripts/release.py seal-candidate
        cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-assets
        path: release/*
        if-no-files-found: error
        retention-days: 90
