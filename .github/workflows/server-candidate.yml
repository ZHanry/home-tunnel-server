name: Retag accepted NestLink 14 application latest only
# Candidate filename is used only on the isolated maintenance branch. This
# replacement has no build, signing, deployment or Release jobs. workflow_call
# preserves caller validation only; its job is always excluded from CI callers.
'on':
  workflow_call:
    inputs:
      build_candidate:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      mode:
        description: review reads and verifies only; apply retags accepted original manifests
        required: true
        default: review
        type: choice
        options:
        - review
        - apply
        - verify
      expected_workflow_sha:
        description: Exact reviewed maintenance commit SHA; must equal this dispatch HEAD
        required: true
        type: string
      expected_control_latest:
        description: Required for apply, copy previous_latest_digest from successful review (or absent)
        required: false
        type: string
      expected_gateway_latest:
        description: Required for apply, copy previous_latest_digest from successful review (or absent)
        required: false
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: nestlink-server-application-latest-retag
  cancel-in-progress: false
jobs:
  retag:
    if: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Retag accepted NestLink 14 application latest only' && github.repository == 'ZHanry/home-tunnel-server' && startsWith(github.ref, 'refs/heads/maintenance/retag-latest14-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Verify public bindings and review or retag exact manifests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAG_MODE: ${{ inputs.mode }}
        RETAG_EXPECTED_SHA: ${{ inputs.expected_workflow_sha }}
        RETAG_EXPECTED_CONTROL: ${{ inputs.expected_control_latest }}
        RETAG_EXPECTED_GATEWAY: ${{ inputs.expected_gateway_latest }}
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/retag-server-latest14.py \
          --mode "$RETAG_MODE" --checkout "$GITHUB_WORKSPACE" \
          --expected-head "$RETAG_EXPECTED_SHA" --cosign "$(command -v cosign)" \
          --expected-control-latest "$RETAG_EXPECTED_CONTROL" \
          --expected-gateway-latest "$RETAG_EXPECTED_GATEWAY" \
          --output-dir "$RUNNER_TEMP/retag-latest14-evidence"
    - name: Retain genuine review, write-attempt and byte verification evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: retag-latest14-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/retag-latest14-evidence/*
        if-no-files-found: warn
        retention-days: 90
