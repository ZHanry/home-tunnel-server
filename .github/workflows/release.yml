name: Release server
'on':
  push:
    tags:
    - v*
permissions:
  contents: write
  checks: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Validate component tag and CI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      stable: ${{ steps.version.outputs.stable }}
      rc-version: ${{ steps.version.outputs.rc-version }}
      rc-tag: ${{ steps.version.outputs.rc-tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/release.py metadata
  images:
    name: Image (${{ matrix.name }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: control-center
          context: ./control-center
          image: ghcr.io/zhanry/home-tunnel-control-center
        - name: traffic-gateway
          context: ./traffic-gateway
          image: ghcr.io/zhanry/home-tunnel-traffic-gateway
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: ${{ matrix.context }}
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ matrix.image }}:${{ needs.metadata.outputs.rc-version }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ needs.metadata.outputs.rc-version }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}
    - name: Publish GitHub image attestation
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-name: ${{ matrix.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Keyless-sign immutable image digest
      env:
        IMAGE: ${{ matrix.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        cosign sign --yes "$IMAGE@$DIGEST"
    - name: Write machine-readable digest record
      shell: bash
      env:
        NAME: ${{ matrix.name }}
        IMAGE: ${{ matrix.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        VERSION: ${{ needs.metadata.outputs.rc-version }}
      run: |
        jq -n --arg name "$NAME" --arg image "$IMAGE" --arg digest "$DIGEST" \
          --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
          '{name:$name,image:$image,digest:$digest,version:$version,revision:$revision}' > "image-$NAME.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: image-${{ matrix.name }}
        path: image-${{ matrix.name }}.json
        if-no-files-found: error
  collect:
    name: Collect complete component artifact set
    runs-on: ubuntu-latest
    needs:
    - metadata
    - images
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: image-*
        path: release
        merge-multiple: true
    - run: |
        cp contracts/home-tunnel.v1.json contracts/openapi.v1.json contracts/api.schema.json release/
        cp contracts/remote-desktop.v1.json contracts/remote-authorization-vectors.json contracts/REMOTE_PROTOCOL.md release/
        cp deploy/frps/dependency.json release/frps-dependency.json
        cp deploy/frps/dependency.sigstore.json release/frps-dependency.json.sigstore.json
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/release.py seal
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-assets
        path: release/*
        if-no-files-found: error
  integration:
    name: Server integration (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
    - metadata
    - collect
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: candidate-assets
        path: release
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Run production-path integration with pinned client
      env:
        RC_VERSION: ${{ needs.metadata.outputs.rc-version }}
        SMOKE_ARCH: ${{ matrix.arch }}
        HOME_TUNNEL_SMOKE_CLIENT_CREATION: "1"
      run: |
        set -euo pipefail
        python3 scripts/fetch-client-baseline.py "$SMOKE_ARCH" release
        export CLIENT_VERSION="$(jq -r .version tests/client-baseline.json)"
        export CONTROL_IMAGE="$(jq -r '.image + "@" + .digest' release/image-control-center.json)"
        export FRPS_IMAGE="$(jq -r '.image + "@" + .digest' release/frps-dependency.json)"
        export GATEWAY_IMAGE="$(jq -r '.image + "@" + .digest' release/image-traffic-gateway.json)"
        bash ./tests/run-release-smoke.sh
        mkdir -p integration
        cp release-smoke-evidence/release-smoke.json "integration/server-smoke-$SMOKE_ARCH.json"
        cp release-smoke-evidence/e2e-smoke.json "integration/server-port-settings-$SMOKE_ARCH.json"
    - name: Verify real STUN-only runtime in an isolated namespace
      env:
        SMOKE_ARCH: ${{ matrix.arch }}
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables
        python3 tests/stun-runtime.py --output "integration/stun-runtime-$SMOKE_ARCH.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: server-smoke-${{ matrix.arch }}
        path: integration/*
        if-no-files-found: error
  rc-release:
    name: Publish verified release
    runs-on: ubuntu-latest
    needs:
    - metadata
    - collect
    - integration
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: candidate-assets
        path: release
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: server-smoke-*
        path: release
        merge-multiple: true
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - name: Seal and publish verified release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/release.py seal
        cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
        python3 scripts/release.py stable
    - name: Preserve release verification evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-verification-evidence
        path: release/*
        if-no-files-found: error
        retention-days: 90
