name: Publish accepted server candidate
'on':
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful ci.yml run that sealed this candidate
        required: true
        type: string
      acceptance_json:
        description: Real server acceptance JSON for that run, images, gates, and batch
        required: true
        type: string
permissions:
  contents: write
  actions: read
  packages: read
  id-token: write
  attestations: write
jobs:
  publish:
    name: Publish the accepted candidate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - id: origin
      name: Verify candidate origin before any new signature
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        HOME_TUNNEL_RELEASE_DIR: ${{ runner.temp }}/candidate-release
        HOME_TUNNEL_BOUND_ORIGIN: ${{ runner.temp }}/bound-origin.json
        HOME_TUNNEL_ROOT: ${{ github.workspace }}
      run: |
        set -euo pipefail
        case "$CANDIDATE_RUN_ID" in
          ''|*[!0-9]*)
            echo "candidate run id is invalid" >&2
            exit 1
            ;;
        esac
        mkdir -p "$RUNNER_TEMP/publisher/scripts"
        cp scripts/release.py scripts/release_candidate.py "$RUNNER_TEMP/publisher/scripts/"
        python3 scripts/release.py verify-publication-origin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.origin.outputs.candidate_sha }}
        fetch-depth: 0
        persist-credentials: true
    - name: Require the candidate source contract
      env:
        HOME_TUNNEL_ROOT: ${{ github.workspace }}
        HOME_TUNNEL_BOUND_ORIGIN: ${{ runner.temp }}/bound-origin.json
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/publisher/scripts/release.py" assert-release-contract
    - name: Seal acceptance evidence beside the original bytes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACCEPTANCE_JSON: ${{ inputs.acceptance_json }}
        HOME_TUNNEL_RELEASE_WORKFLOW: publish-stable.yml
        HOME_TUNNEL_RELEASE_REF: ${{ github.ref }}
        HOME_TUNNEL_ROOT: ${{ github.workspace }}
        HOME_TUNNEL_RELEASE_DIR: ${{ runner.temp }}/candidate-release
        HOME_TUNNEL_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        HOME_TUNNEL_BOUND_ORIGIN: ${{ runner.temp }}/bound-origin.json
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/publisher/scripts/release.py" prepare-acceptance
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: ${{ runner.temp }}/acceptance/server-acceptance.SHA256SUMS.txt
    - name: Publish original artifacts and the separate acceptance seal
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOME_TUNNEL_RELEASE_REF: ${{ github.ref }}
        HOME_TUNNEL_ROOT: ${{ github.workspace }}
        HOME_TUNNEL_RELEASE_DIR: ${{ runner.temp }}/candidate-release
        HOME_TUNNEL_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        HOME_TUNNEL_BOUND_ORIGIN: ${{ runner.temp }}/bound-origin.json
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/publisher/scripts/release.py" publish-accepted
