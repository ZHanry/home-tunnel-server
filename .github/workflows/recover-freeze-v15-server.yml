name: Apply exact API 1.5 freeze once
on:
  push:
    branches: [codex/freeze-api-v1-5]
    paths: ['.github/workflows/recover-freeze-v15-server.yml']
permissions:
  contents: read
concurrency:
  group: recover-freeze-v15-server
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'ZHanry/home-tunnel-server' && github.ref == 'refs/heads/codex/freeze-api-v1-5' && github.event_name == 'push' && github.event.before == 'e0bd2f1e4f7622b1f10b5d683551f793f02b4771'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Reconstruct only reviewed hashes and push this branch without force
        run: python3 -I .recovery/freeze-v15-server/recover.py
