name: Revalidate sealed server candidate
'on':
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Existing successful ci.yml candidate run; original bytes are never changed
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  revalidate:
    name: Revalidate original images (${{ matrix.arch }})
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: origin
      name: Verify the original candidate origin, checksums and image signatures
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        HOME_TUNNEL_ROOT: ${{ github.workspace }}
        HOME_TUNNEL_RELEASE_DIR: ${{ runner.temp }}/original-candidate
        HOME_TUNNEL_BOUND_ORIGIN: ${{ runner.temp }}/bound-origin.json
      run: |
        set -euo pipefail
        python3 scripts/release.py verify-publication-origin
        mkdir -p "$RUNNER_TEMP/publisher/scripts"
        cp scripts/release.py scripts/release_candidate.py "$RUNNER_TEMP/publisher/scripts/"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.origin.outputs.candidate_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require the original source and current security evidence
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOME_TUNNEL_ROOT: ${{ github.workspace }}
        HOME_TUNNEL_BOUND_ORIGIN: ${{ runner.temp }}/bound-origin.json
        CANDIDATE_SHA: ${{ steps.origin.outputs.candidate_sha }}
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/publisher/scripts/release.py" assert-release-contract
        git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
        python3 - <<'PY'
        import json, os, subprocess, sys
        sys.path.insert(0, 'scripts')
        import release_candidate as policy
        repository = os.environ['GITHUB_REPOSITORY']
        sha = os.environ['CANDIDATE_SHA']
        runs = []
        for page in (1, 2, 3):
            payload = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs?head_sha={sha}&per_page=100&page={page}'], text=True))
            rows = payload.get('workflow_runs') or []
            runs.extend(rows)
            if len(rows) < 100:
                break
        policy.require(policy.security_gate_errors(runs, sha, repository))
        PY
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.0
    - name: Execute original production-path tests against original image digests
      env:
        SMOKE_ARCH: ${{ matrix.arch }}
        HOME_TUNNEL_SMOKE_CLIENT_CREATION: '1'
        RELEASE_DIR: ${{ runner.temp }}/revalidation-client
        EVIDENCE_DIR: ${{ runner.temp }}/revalidation-evidence
      run: |
        set -euo pipefail
        mkdir -p "$EVIDENCE_DIR"
        date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/runtime-started-at.txt"
        python3 scripts/fetch-client-baseline.py "$SMOKE_ARCH" "$RELEASE_DIR"
        export RC_VERSION="$(jq -r .version "$RUNNER_TEMP/original-candidate/release-manifest.json")"
        export CLIENT_VERSION="$(jq -r .version tests/client-baseline.json)"
        export CONTROL_IMAGE="$(jq -r '.image + "@" + .digest' "$RUNNER_TEMP/original-candidate/image-control-center.json")"
        export GATEWAY_IMAGE="$(jq -r '.image + "@" + .digest' "$RUNNER_TEMP/original-candidate/image-traffic-gateway.json")"
        export FRPS_IMAGE="$(jq -r '.image + "@" + .digest' "$RUNNER_TEMP/original-candidate/frps-dependency.json")"
        bash tests/run-release-smoke.sh
        cp "$EVIDENCE_DIR/release-smoke.json" "$EVIDENCE_DIR/server-smoke-$SMOKE_ARCH.json"
        cp "$EVIDENCE_DIR/e2e-smoke.json" "$EVIDENCE_DIR/server-port-settings-$SMOKE_ARCH.json"
        sudo apt-get update
        sudo apt-get install -y nftables
        python3 tests/stun-runtime.py --output "$EVIDENCE_DIR/stun-runtime-$SMOKE_ARCH.json"
    - name: Record real execution time and prove original bytes remain unchanged
      env:
        SMOKE_ARCH: ${{ matrix.arch }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from datetime import datetime, timezone
        from pathlib import Path
        import hashlib, json, os, subprocess, sys
        sys.path.insert(0, 'scripts')
        import release_candidate as policy
        original = Path(os.environ['RUNNER_TEMP']) / 'original-candidate'
        evidence = Path(os.environ['RUNNER_TEMP']) / 'revalidation-evidence'
        bound = json.loads((original.parent / 'bound-origin.json').read_text())
        policy.assert_seal_preserved(original, bound['seal'])
        sealed_files = policy.verify_artifact_files(original)
        sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        assert sha == bound['candidate_sha']
        arch = os.environ['SMOKE_ARCH']
        manifest = json.loads((original / 'release-manifest.json').read_text())
        smoke = json.loads((evidence / f'server-smoke-{arch}.json').read_text())
        stun = json.loads((evidence / f'stun-runtime-{arch}.json').read_text())
        assert smoke['status'] == 'passed' and stun['status'] == 'passed'
        assert stun['repository_revision'] == sha
        for name, key in (('control-center', 'control_image'), ('traffic-gateway', 'gateway_image')):
            image = manifest['images'][name]
            assert smoke[key] == image['image'] + '@' + image['digest']
        record = {
            'schema': 'home-tunnel-server-revalidation/1', 'status': 'passed',
            'candidate_run_id': os.environ['CANDIDATE_RUN_ID'],
            'source_sha': sha, 'arch': arch, 'images': manifest['images'],
            'revalidation_run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            'started_at': (evidence / 'runtime-started-at.txt').read_text().strip(),
            'observed_at': datetime.now(timezone.utc).isoformat(),
            'rebuilt': False, 'original_seal': bound['seal'],
            'original_artifact_digest': bound['artifact_digest'],
            'original_files_verified': len(sealed_files),
            'scope': 'Native architecture production-path smoke and isolated STUN runtime against unchanged candidate image digests, with the source-pinned historical Linux client baseline. No production deployment or cross-product remote-desktop acceptance.',
            'command': 'bash tests/run-release-smoke.sh; python3 tests/stun-runtime.py',
            'environment': {'runner_os': os.environ['RUNNER_OS'], 'runner_arch': os.environ['RUNNER_ARCH']},
            'files': {p.name: {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size} for p in sorted(evidence.iterdir()) if p.is_file()},
        }
        (evidence / f'server-revalidation-{arch}.json').write_text(json.dumps(record, indent=2) + '\n')
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: server-revalidation-${{ matrix.arch }}
        path: ${{ runner.temp }}/revalidation-evidence/*
        if-no-files-found: warn
        retention-days: 90
