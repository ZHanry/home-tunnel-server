# Requires the host nftables protection from deploy/stun/firewall.nft.
# This service discovers addresses only. It cannot relay desktop media.
services:
  stun:
    profiles: [stun]
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "${HOME_TUNNEL_STUN_BIND_ADDRESS:-0.0.0.0}:3478:3478/udp"
    volumes:
      - ./deploy/stun/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=8m,noexec,nosuid,nodev]
    mem_limit: 64m
    cpus: "0.20"
    pids_limit: 32
    healthcheck:
      test: [CMD, turnutils_stunclient, -p, "3478", "127.0.0.1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
