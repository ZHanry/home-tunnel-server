services:
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [monitoring]
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [internal_service_key]
    networks: [control]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./deploy/monitoring/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets: [internal_service_key]
    networks: [control]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [monitoring]
    command: [--config.file=/etc/blackbox/config.yml]
    volumes: [./deploy/monitoring/blackbox.yml:/etc/blackbox/config.yml:ro]
    networks: [control, edge]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: [127.0.0.1:3000:3000]
    networks: [control]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128

volumes:
  alertmanager-data:
  prometheus-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password
