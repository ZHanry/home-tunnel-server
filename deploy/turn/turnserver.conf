# UDP TURN relay fallback for remote desktop peers that cannot punch a direct
# path. It forwards DTLS-SRTP ciphertext only; it cannot read desktop media.
# Credentials are short-lived TURN REST credentials minted by the control center.
listening-port=3479
listening-ip=0.0.0.0
min-port=49160
max-port=49179
use-auth-secret
realm=home-tunnel
no-tcp
no-tls
no-dtls
no-cli
no-tcp-relay
no-multicast-peers
no-rfc5780
no-software-attribute
fingerprint
stale-nonce=600
# Bound each credential and the whole relay; one desktop session uses one allocation.
user-quota=4
total-quota=40
max-bps=3000000
bps-capacity=12500000
# Relay only to public peers: never loop back into the host, Docker or the VCN.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# No IPv6 ranges: the relay binds IPv4 only, and coturn 4.6.3 matches IPv6
# denied-peer-ip ranges against IPv4 peers too, which denied every peer.
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
# external-ip and static-auth-secret are appended at start from the environment
# and the mounted secret, so the secret never appears on a command line.
