listening-port=3478
listening-ip=0.0.0.0
stun-only
no-auth
no-tcp
no-tls
no-dtls
no-cli
no-tcp-relay
# stun-only rejects TURN requests. Coturn refuses to start if both
# no-tcp-relay and no-udp-relay are set, even in STUN-only mode.
no-rfc5780
no-software-attribute
no-multicast-peers
fingerprint
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
# Deliberately no external-ip override: Binding must report the observed source.
# Do not add credentials, TURN allocation ports, alternate servers or TLS listeners.
