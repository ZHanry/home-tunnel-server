name: home-tunnel

x-logging: &default-logging
  driver: local
  options:
    max-size: 5m
    max-file: "3"

services:
  control-center:
    image: ${HOME_TUNNEL_CONTROL_IMAGE:-ghcr.io/zhanry/home-tunnel-control-center}:${HOME_TUNNEL_VERSION:-11.0.0-rc.2}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOMEDESK_ID_SERVER: ${HOME_TUNNEL_HBBS_SERVER:-}
      HOMEDESK_HBBS_PUBLIC_KEY: ${HOME_TUNNEL_HBBS_PUBLIC_KEY:-}
      NODE_OPTIONS: --max-old-space-size=160 --disable-warning=ExperimentalWarning
      PORT: "8080"
      PUBLIC_BASE_URL: ${HOME_TUNNEL_PUBLIC_BASE_URL:?set HOME_TUNNEL_PUBLIC_BASE_URL in .env}
      DOWNLOADS_DIRECTORY: /app/downloads
      SQLITE_PATH: /data/home-tunnel.db
      TUNNEL_DOMAIN: ${HOME_TUNNEL_TUNNEL_DOMAIN:?set HOME_TUNNEL_TUNNEL_DOMAIN in .env}
      PUBLIC_FRPS_HOST: ${HOME_TUNNEL_FRPS_PUBLIC_HOST:?set HOME_TUNNEL_FRPS_PUBLIC_HOST in .env}
      PUBLIC_FRPS_PORT: ${HOME_TUNNEL_FRPS_PORT:-7000}
      COOKIE_SECURE: "true"
      PASSWORD_HASH_CONCURRENCY: "1"
      PASSWORD_HASH_QUEUE_MAX: "32"
      INTERNAL_SERVICE_KEY_FILE: /run/secrets/internal_service_key
      FRPS_PLUGIN_KEY_FILE: /run/secrets/frps_plugin_key
      LEASE_SIGNING_KEY_FILE: /run/secrets/lease_signing_key
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      FRPS_TLS_CERT_FILE: /run/secrets/frps_tls_cert
      BOOTSTRAP_ADMIN_USERNAME: ${HOME_TUNNEL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GATEWAY_HEALTH_URL: http://traffic-gateway:8080/healthz
      FRPS_HOST: frps
      FRPS_PORT: "7000"
      CADDY_HOST: caddy
      CADDY_PORT: "80"
      BACKUP_STATUS_FILE: /run/home-tunnel-status/backup.json
      ALERT_WEBHOOK_URL: ${HOME_TUNNEL_ALERT_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${HOME_TUNNEL_ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${HOME_TUNNEL_ALERT_TELEGRAM_CHAT_ID:-}
    secrets:
      - internal_service_key
      - frps_plugin_key
      - lease_signing_key
      - bootstrap_admin_password
      - frps_tls_cert
    volumes:
      - sqlite-data:/data
      - ./deploy/downloads:/app/downloads:ro
      - home-tunnel-status:/run/home-tunnel-status:ro
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 320m
    cpus: "0.50"
    pids_limit: 96
    stop_grace_period: 20s
    logging: *default-logging

  traffic-gateway:
    image: ${HOME_TUNNEL_GATEWAY_IMAGE:-ghcr.io/zhanry/home-tunnel-traffic-gateway}:${HOME_TUNNEL_VERSION:-11.0.0-rc.2}
    restart: unless-stopped
    init: true
    depends_on:
      control-center:
        condition: service_healthy
      frps:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --max-old-space-size=96
      PORT: "8080"
      CONTROL_CENTER_URL: http://control-center:8080
      FRPS_VHOST_HOST: frps
      FRPS_VHOST_PORT: "8080"
      INTERNAL_SERVICE_KEY_FILE: /run/secrets/internal_service_key
      POLICY_FULL_SYNC_MS: "300000"
      POLICY_RECONNECT_MS: "3000"
      SAMPLE_BUCKET_SECONDS: "60"
    secrets:
      - internal_service_key
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz',{headers:{host:'127.0.0.1:8080'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 160m
    cpus: "0.35"
    pids_limit: 96
    stop_grace_period: 20s
    logging: *default-logging

  frps:
    image: ${HOME_TUNNEL_FRPS_IMAGE:-ghcr.io/zhanry/home-tunnel-frps:0.70.1-r3@sha256:b5636ba951da6e27d76caff228fb17b8511695ffbcdca3a04b0bc93d593e6716}
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_FRPS_PORT: "${HOME_TUNNEL_FRPS_PORT:-7000}"
    depends_on:
      control-center:
        condition: service_healthy
    ports:
      - "${HOME_TUNNEL_FRPS_BIND_ADDRESS:-0.0.0.0}:${HOME_TUNNEL_FRPS_PORT:-7000}:7000/tcp"
    secrets:
      - frps_plugin_key
      - frps_tls_cert
      - frps_tls_key
    tmpfs:
      - /run/frp:size=8m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
      - /tmp:size=8m,noexec,nosuid,nodev
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 7000"]
      interval: 30s
      start_interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 96
    stop_grace_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      control-center:
        condition: service_healthy
      traffic-gateway:
        condition: service_healthy
    environment:
      HOME_TUNNEL_ACME_EMAIL: ${HOME_TUNNEL_ACME_EMAIL:?set HOME_TUNNEL_ACME_EMAIL in .env}
      HOME_TUNNEL_CONSOLE_HOST: ${HOME_TUNNEL_CONSOLE_HOST:?set HOME_TUNNEL_CONSOLE_HOST in .env}
      HOME_TUNNEL_TUNNEL_DOMAIN: ${HOME_TUNNEL_TUNNEL_DOMAIN:?set HOME_TUNNEL_TUNNEL_DOMAIN in .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile.selfhost:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 96
    logging: *default-logging

  # Only rendezvous/NAT signaling. No hbbr, TURN or media gateway is deployed.
  # Prepare the private named volume once; this reuses the existing FRPS image.
  hbbs-state:
    image: ${HOME_TUNNEL_FRPS_IMAGE:-ghcr.io/zhanry/home-tunnel-frps:0.70.1-r3@sha256:b5636ba951da6e27d76caff228fb17b8511695ffbcdca3a04b0bc93d593e6716}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chmod 700 /state"]
    volumes: [hbbs-data:/state]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 16m
    pids_limit: 8

  hbbs:
    image: ghcr.io/rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    command: ["hbbs", "-k", "_"]
    depends_on:
      hbbs-state:
        condition: service_completed_successfully
    working_dir: /root
    restart: unless-stopped
    init: true
    ports:
      - "${HOME_TUNNEL_HBBS_BIND_ADDRESS:-0.0.0.0}:21115:21115/tcp"
      - "${HOME_TUNNEL_HBBS_BIND_ADDRESS:-0.0.0.0}:21116:21116/tcp"
      - "${HOME_TUNNEL_HBBS_BIND_ADDRESS:-0.0.0.0}:21116:21116/udp"
    volumes: [hbbs-data:/root]
    read_only: true
    tmpfs:
      - "/tmp:size=8m,noexec,nosuid,nodev"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64

volumes:
  hbbs-data:
  sqlite-data:
  caddy-data:
  caddy-config:
  home-tunnel-status:

networks:
  control:
    internal: true
  edge:

secrets:
  internal_service_key:
    file: ./deploy/secrets/internal_service_key
  frps_plugin_key:
    file: ./deploy/secrets/frps_plugin_key
  lease_signing_key:
    file: ./deploy/secrets/lease_signing_key
  bootstrap_admin_password:
    file: ./deploy/secrets/bootstrap_admin_password
  frps_tls_cert:
    file: ./deploy/secrets/frps_tls_cert.pem
  frps_tls_key:
    file: ./deploy/secrets/frps_tls_key.pem
